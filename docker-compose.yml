services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nids
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nids_dashboard
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nids -d nids_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://nids:${POSTGRES_PASSWORD}@db:5432/nids_dashboard
      SECRET_KEY: ${SECRET_KEY}
      ALERT_SOURCE: seed
      SEED_FILE: ../docs/simulated_alerts.json
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: